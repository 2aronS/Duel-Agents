[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "llama-index-llms-duel"
version = "0.1.0"
description = "llama-index llms duel agents integration"
authors = ["Aaron Shaw"]
license = "MIT"
readme = "README.md"
homepage = "https://duelagents.com"
repository = "https://github.com/2aronS/Duel-Agents"
keywords = ["duel", "duel-agents", "llm", "model-routing", "openai"]
packages = [{ include = "llama_index/" }]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
llama-index-llms-openai-like = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"

[tool.llamahub]
contains_example = false
import_path = "llama_index.llms.duel"

[tool.llamahub.class_authors]
DuelLLM = "2aronS"
